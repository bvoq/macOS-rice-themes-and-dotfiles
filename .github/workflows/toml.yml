name: toml checks

on:
  pull_request:
    paths:
      - "**/*.toml"
      - ".github/workflows/toml.yml"
  push:
    paths:
      - "**/*.toml"
      - ".github/workflows/toml.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate TOML
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            printf 'Validating %s\n' "$file"
            python3 - "$file" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as file:
              tomllib.load(file)
          PY
          done < <(git ls-files -z -- '*.toml')