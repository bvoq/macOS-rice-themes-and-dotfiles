name: toml checks

on:
  pull_request:
    paths:
      - "**/*.toml"
      - ".github/workflows/toml.yml"
  push:
    paths:
      - "**/*.toml"
      - ".github/workflows/toml.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate TOML
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_TIMEOUT=30s

          while IFS= read -r -d '' file; do
            printf 'Validating %s\n' "$file"
            set +e
            timeout "$VALIDATION_TIMEOUT" python3 - "$file" <<'PY'
          import sys
          import tomllib

          print(f"{sys.argv[1]}: reading TOML", flush=True)
          with open(sys.argv[1], "rb") as file:
              tomllib.load(file)
          print(f"{sys.argv[1]}: TOML parse passed", flush=True)
          PY
            status=$?
            set -e
            if [[ "$status" -eq 124 ]]; then
              printf 'Timed out validating %s after %s\n' "$file" "$VALIDATION_TIMEOUT" >&2
              exit "$status"
            elif [[ "$status" -ne 0 ]]; then
              exit "$status"
            fi
          done < <(git ls-files -z -- '*.toml')