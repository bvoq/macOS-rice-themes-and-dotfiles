name: yaml checks

on:
  pull_request:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml.yml"
  push:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install validators
        run: npm install --no-save ajv@8 ajv-formats@3 jsonc-parser@3 yaml@2

      - name: Validate YAML
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            node - "$file" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const Ajv = require('ajv');
          const addFormats = require('ajv-formats');
          const { parse, printParseErrorCode } = require('jsonc-parser');
          const YAML = require('yaml');

          const fetchText = async (uri) => {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
              const response = await fetch(uri, { signal: controller.signal });
              if (!response.ok) throw new Error(`${uri} returned ${response.status}`);
              return await response.text();
            } finally {
              clearTimeout(timeout);
            }
          };

          (async () => {
            const file = process.argv[2];
            const values = [];
            for (const document of YAML.parseAllDocuments(fs.readFileSync(file, 'utf8'), { prettyErrors: true })) {
              for (const error of document.errors) console.error(`${file}: ${error.message}`);
              if (document.errors.length) process.exit(1);
              values.push(document.toJSON());
            }

            for (const value of values) {
              if (!value || typeof value !== 'object' || typeof value.$schema !== 'string') continue;
              const schemaText = /^https?:\/\//.test(value.$schema)
                ? await fetchText(value.$schema)
                : fs.readFileSync(path.resolve(path.dirname(file), value.$schema), 'utf8');
              const errors = [];
              const schema = parse(schemaText, errors, { allowTrailingComma: true, disallowComments: false });
              for (const error of errors) console.error(`${file}: schema ${printParseErrorCode(error.error)} at offset ${error.offset}`);
              if (errors.length) process.exit(1);

              const ajv = new Ajv({ allErrors: true, loadSchema: async (uri) => JSON.parse(await fetchText(uri)), strict: false });
              addFormats(ajv);
              const validate = await ajv.compileAsync(schema);
              if (!validate(value)) {
                for (const error of validate.errors || []) console.error(`${file}: ${error.instancePath || '/'} ${error.message}`);
                process.exit(1);
              }
            }
          })().catch((error) => { console.error(`${process.argv[2]}: ${error.message}`); process.exit(1); });
          NODE
          done < <(git ls-files -z -- '*.yml' '*.yaml')