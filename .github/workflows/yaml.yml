name: yaml checks

on:
  pull_request:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml.yml"
  push:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/yaml.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install validators
        run: npm install --no-save ajv@8 ajv-formats@3 jsonc-parser@3 yaml@2

      - name: Validate YAML
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_TIMEOUT=30s

          while IFS= read -r -d '' file; do
            printf 'Validating %s\n' "$file"
            set +e
            timeout "$VALIDATION_TIMEOUT" node - "$file" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const Ajv = require('ajv/dist/2019');
          const addFormats = require('ajv-formats');
          const { parse, printParseErrorCode } = require('jsonc-parser');
          const YAML = require('yaml');

          const FETCH_TIMEOUT_MS = 5000;
          const isRemoteSchema = (uri) => /^https?:\/\//.test(uri);
          const withoutFragment = (uri) => uri.replace(/#.*/, '');
          const resolveSchemaUri = (uri, baseUri) => {
            if (isRemoteSchema(uri)) return uri;
            if (isRemoteSchema(baseUri)) return new URL(uri, baseUri).toString();
            return path.resolve(path.dirname(baseUri), uri);
          };
          const schemaTextCache = new Map();
          const readSchemaText = async (uri) => {
            const uriWithoutFragment = withoutFragment(uri);
            if (schemaTextCache.has(uriWithoutFragment)) {
              console.log(`Using cached schema ${uriWithoutFragment}`);
              return schemaTextCache.get(uriWithoutFragment);
            }
            if (!isRemoteSchema(uriWithoutFragment)) {
              console.log(`Reading local schema ${uriWithoutFragment}`);
              const text = fs.readFileSync(uriWithoutFragment, 'utf8');
              console.log(`Read local schema ${uriWithoutFragment} (${text.length} bytes)`);
              const result = { text, uri: uriWithoutFragment };
              schemaTextCache.set(uriWithoutFragment, result);
              return result;
            }

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
            const startedAt = Date.now();
            try {
              console.log(`Fetching schema ${uriWithoutFragment}`);
              const response = await fetch(uriWithoutFragment, { redirect: 'follow', signal: controller.signal });
              console.log(`Schema response ${uriWithoutFragment}: HTTP ${response.status} -> ${response.url || uriWithoutFragment}`);
              if (!response.ok) throw new Error(`${uriWithoutFragment} returned ${response.status}`);
              const text = await response.text();
              console.log(`Fetched schema ${uriWithoutFragment} (${text.length} bytes in ${Date.now() - startedAt} ms)`);
              const result = { text, uri: response.url || uriWithoutFragment };
              schemaTextCache.set(uriWithoutFragment, result);
              return result;
            } catch (error) {
              if (error.name === 'AbortError') throw new Error(`${uriWithoutFragment} could not be fetched within ${FETCH_TIMEOUT_MS / 1000} seconds`);
              throw new Error(`${uriWithoutFragment} could not be fetched: ${error.message}`);
            } finally {
              clearTimeout(timeout);
            }
          };

          (async () => {
            const file = process.argv[2];
            console.log(`${file}: reading YAML`);
            const values = [];
            for (const document of YAML.parseAllDocuments(fs.readFileSync(file, 'utf8'), { prettyErrors: true })) {
              for (const error of document.errors) console.error(`${file}: ${error.message}`);
              if (document.errors.length) process.exit(1);
              values.push(document.toJSON());
            }
            console.log(`${file}: parsed ${values.length} YAML document(s)`);

            for (const [index, value] of values.entries()) {
              const label = values.length === 1 ? file : `${file} document ${index + 1}`;
              if (!value || typeof value !== 'object' || typeof value.$schema !== 'string') {
                console.log(`${label}: no $schema, skipping schema validation`);
                continue;
              }
              const schemaLocation = resolveSchemaUri(value.$schema, file);
              console.log(`${label}: schema ${value.$schema} resolved to ${schemaLocation}`);
              const { text: schemaText, uri: schemaBaseUri } = await readSchemaText(schemaLocation);
              console.log(`${label}: parsing schema ${schemaBaseUri}`);
              const errors = [];
              const schema = parse(schemaText, errors, { allowTrailingComma: true, disallowComments: false });
              for (const error of errors) console.error(`${label}: schema ${printParseErrorCode(error.error)} at offset ${error.offset}`);
              if (errors.length) process.exit(1);
              if (schema && typeof schema === 'object' && !schema.$id) schema.$id = schemaBaseUri;

              console.log(`${label}: compiling schema ${schemaBaseUri}`);
              const ajv = new Ajv({ allErrors: true, loadSchema: async (uri) => {
                const resolvedUri = resolveSchemaUri(uri, schemaBaseUri);
                console.log(`${label}: loading referenced schema ${uri} resolved to ${resolvedUri}`);
                return JSON.parse((await readSchemaText(resolvedUri)).text);
              }, strict: false, unicodeRegExp: false });
              addFormats(ajv);
              const validate = await ajv.compileAsync(schema);
              console.log(`${label}: running validation`);
              if (!validate(value)) {
                for (const error of validate.errors || []) console.error(`${label}: ${error.instancePath || '/'} ${error.message}`);
                process.exit(1);
              }
              console.log(`${label}: validation passed`);
            }
          })().catch((error) => { console.error(`${process.argv[2]}: ${error.message}`); process.exit(1); });
          NODE
            status=$?
            set -e
            if [[ "$status" -eq 124 ]]; then
              printf 'Timed out validating %s after %s\n' "$file" "$VALIDATION_TIMEOUT" >&2
              exit "$status"
            elif [[ "$status" -ne 0 ]]; then
              exit "$status"
            fi
          done < <(git ls-files -z -- '*.yml' '*.yaml')