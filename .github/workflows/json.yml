name: json checks

on:
  pull_request:
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - ".github/workflows/json.yml"
  push:
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - ".github/workflows/json.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install validators
        run: npm install --no-save ajv@8 ajv-formats@3 jsonc-parser@3

      - name: Validate JSON and JSONC
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            printf 'Validating %s\n' "$file"
            node - "$file" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const Ajv = require('ajv');
          const addFormats = require('ajv-formats');
          const { parse, printParseErrorCode } = require('jsonc-parser');

          const FETCH_TIMEOUT_MS = 5000;
          const isRemoteSchema = (uri) => /^https?:\/\//.test(uri);
          const withoutFragment = (uri) => uri.replace(/#.*/, '');
          const resolveSchemaUri = (uri, baseUri) => {
            if (isRemoteSchema(uri)) return uri;
            if (isRemoteSchema(baseUri)) return new URL(uri, baseUri).toString();
            return path.resolve(path.dirname(baseUri), uri);
          };
          const readSchemaText = async (uri) => {
            const uriWithoutFragment = withoutFragment(uri);
            if (!isRemoteSchema(uriWithoutFragment)) return { text: fs.readFileSync(uriWithoutFragment, 'utf8'), uri: uriWithoutFragment };

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
            try {
              const response = await fetch(uriWithoutFragment, { redirect: 'follow', signal: controller.signal });
              if (!response.ok) throw new Error(`${uriWithoutFragment} returned ${response.status}`);
              return { text: await response.text(), uri: response.url || uriWithoutFragment };
            } catch (error) {
              if (error.name === 'AbortError') throw new Error(`${uriWithoutFragment} could not be fetched within ${FETCH_TIMEOUT_MS / 1000} seconds`);
              throw new Error(`${uriWithoutFragment} could not be fetched: ${error.message}`);
            } finally {
              clearTimeout(timeout);
            }
          };

          (async () => {
            const file = process.argv[2];
            const errors = [];
            const value = parse(fs.readFileSync(file, 'utf8'), errors, { allowTrailingComma: true, disallowComments: false });
            for (const error of errors) console.error(`${file}: ${printParseErrorCode(error.error)} at offset ${error.offset}`);
            if (errors.length) process.exit(1);
            if (!value || typeof value !== 'object' || typeof value.$schema !== 'string') return;

            const schemaLocation = resolveSchemaUri(value.$schema, file);
            const { text: schemaText, uri: schemaBaseUri } = await readSchemaText(schemaLocation);
            const schemaErrors = [];
            const schema = parse(schemaText, schemaErrors, { allowTrailingComma: true, disallowComments: false });
            for (const error of schemaErrors) console.error(`${file}: schema ${printParseErrorCode(error.error)} at offset ${error.offset}`);
            if (schemaErrors.length) process.exit(1);
            if (schema && typeof schema === 'object' && !schema.$id) schema.$id = schemaBaseUri;

            const ajv = new Ajv({ allErrors: true, loadSchema: async (uri) => JSON.parse((await readSchemaText(resolveSchemaUri(uri, schemaBaseUri))).text), strict: false });
            addFormats(ajv);
            const validate = await ajv.compileAsync(schema);
            if (!validate(value)) {
              for (const error of validate.errors || []) console.error(`${file}: ${error.instancePath || '/'} ${error.message}`);
              process.exit(1);
            }
          })().catch((error) => { console.error(`${process.argv[2]}: ${error.message}`); process.exit(1); });
          NODE
          done < <(git ls-files -z -- '*.json' '*.jsonc')