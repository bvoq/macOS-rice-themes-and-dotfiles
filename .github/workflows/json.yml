name: json checks

on:
  pull_request:
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - ".github/workflows/json.yml"
  push:
    paths:
      - "**/*.json"
      - "**/*.jsonc"
      - ".github/workflows/json.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install validators
        run: npm install --no-save ajv@8 ajv-formats@3 jsonc-parser@3

      - name: Validate JSON and JSONC
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            node - "$file" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const Ajv = require('ajv');
          const addFormats = require('ajv-formats');
          const { parse, printParseErrorCode } = require('jsonc-parser');

          const fetchText = async (uri) => {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
              const response = await fetch(uri, { signal: controller.signal });
              if (!response.ok) throw new Error(`${uri} returned ${response.status}`);
              return await response.text();
            } finally {
              clearTimeout(timeout);
            }
          };

          (async () => {
            const file = process.argv[2];
            const errors = [];
            const value = parse(fs.readFileSync(file, 'utf8'), errors, { allowTrailingComma: true, disallowComments: false });
            for (const error of errors) console.error(`${file}: ${printParseErrorCode(error.error)} at offset ${error.offset}`);
            if (errors.length) process.exit(1);
            if (!value || typeof value !== 'object' || typeof value.$schema !== 'string') return;

            const schemaText = /^https?:\/\//.test(value.$schema)
              ? await fetchText(value.$schema)
              : fs.readFileSync(path.resolve(path.dirname(file), value.$schema), 'utf8');
            const schemaErrors = [];
            const schema = parse(schemaText, schemaErrors, { allowTrailingComma: true, disallowComments: false });
            for (const error of schemaErrors) console.error(`${file}: schema ${printParseErrorCode(error.error)} at offset ${error.offset}`);
            if (schemaErrors.length) process.exit(1);

            const ajv = new Ajv({ allErrors: true, loadSchema: async (uri) => JSON.parse(await fetchText(uri)), strict: false });
            addFormats(ajv);
            const validate = await ajv.compileAsync(schema);
            if (!validate(value)) {
              for (const error of validate.errors || []) console.error(`${file}: ${error.instancePath || '/'} ${error.message}`);
              process.exit(1);
            }
          })().catch((error) => { console.error(`${process.argv[2]}: ${error.message}`); process.exit(1); });
          NODE
          done < <(git ls-files -z -- '*.json' '*.jsonc')